<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopee Header</title>
    <style>
      .header {
        background-color: #ee4d2d;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        font-family: Arial, sans-serif;
      }
      .nav-top {
        display: flex;
        gap: 15px;
      }
      .nav-top a {
        color: white;
        text-decoration: none;
        font-size: 14px;
      }
      .nav-top a:hover {
        text-decoration: underline;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
      }
      .search-bar {
        flex-grow: 1;
        display: flex;
        justify-content: center;
      }
      .search-bar input {
        width: 50%;
        padding: 5px;
        border: none;
        border-radius: 4px;
      }
      .nav-bottom {
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .nav-bottom a {
        color: white;
        text-decoration: none;
      }
      .nav-bottom a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="nav-top">
        <a href="#">Kênh Người Bán</a> |
        <a href="#">Trở thành Người bán Shopee</a> |
        <a href="#">Tải ứng dụng</a> | <a href="#">Kết nối</a> <span>📱</span>
      </div>
      <div class="logo">Shopee</div>
      <div class="search-bar">
        <input type="text" placeholder="Shopee bao ship 0Đ - Đăng ký ngay!" />
      </div>
      <div class="nav-bottom">
        <a href="#">Thông Báo</a> | <a href="#">Hỗ trợ</a> |
        <a href="#">Tiếng Việt</a> ▼ | <a href="#">Đăng Ký</a> |
        <a href="#">Đăng Nhập</a>
      </div>
    </div>
  </body>
</html>
